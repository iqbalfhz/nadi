services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${APP_NAME}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${REVERB_HOST}
        VITE_REVERB_PORT: ${REVERB_PORT}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME}
    image: nadi-app:latest
    restart: unless-stopped
    # Published at a fixed host port (not left to Coolify's own proxy) —
    # this setup routes public domains via Cloudflare Tunnel to specific
    # host:port combinations, following the same pattern as this VPS's
    # other apps (see the "Published application routes" list).
    ports:
      - "8085:80"
    environment:
      RUN_SETUP: "true"
    env_file:
      - .env
    depends_on:
      - nadi-redis
    volumes:
      - storage_app:/app/storage/app

  reverb:
    image: nadi-app:latest
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0
    ports:
      - "8086:8080"
    depends_on:
      - app
      - nadi-redis
    env_file:
      - .env
    volumes:
      - storage_app:/app/storage/app

  scheduler:
    image: nadi-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - app
      - nadi-redis
    env_file:
      - .env
    volumes:
      - storage_app:/app/storage/app

  # Runs queued jobs — currently the Telegram delivery for Checklist HK.
  # Without this the jobs are written to the database and simply sit there:
  # nothing fails visibly, the reports just never reach the group.
  #
  # Mounts storage_app because the job reads the inspection photos from the
  # private 'internal' disk to upload them.
  queue:
    image: nadi-app:latest
    restart: unless-stopped
    # --max-time recycles the worker hourly so a long-lived process can't
    # accumulate leaked memory or hold stale code after a deploy.
    command: php artisan queue:work --tries=3 --max-time=3600
    depends_on:
      - app
      - nadi-redis
    env_file:
      - .env
    volumes:
      - storage_app:/app/storage/app

  # Session and cache store, replacing the MySQL-backed drivers that added a
  # couple of queries to every single request. Runs as a service of this
  # resource rather than a separate Coolify resource so it lands on the same
  # compose network as app/reverb/scheduler automatically.
  #
  # Named "nadi-redis", not "redis": this VPS runs several Coolify projects on
  # a shared network, more than one of which has a service called "redis". The
  # name resolved to two containers at once —
  #
  #   $ getent hosts redis
  #   fd5a:9590:d076::5   redis
  #   fd5a:9590:d076::10  redis
  #
  # — so Docker handed out connections to whichever it felt like, and roughly
  # half of them hit another project's Redis and were refused with WRONGPASS.
  # That surfaced as a queue worker in a crash loop, and (more quietly) as
  # sessions and cache reads failing at random in the web app.
  #
  # REDIS_HOST must match this name.
  nadi-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence on purpose: everything in here is a session or a cache
    # entry, so losing it on restart costs a re-login and a cold cache, not
    # data. Skipping RDB snapshots also avoids the fork-and-copy memory spike
    # that would hurt most on a small VPS.
    #
    # maxmemory caps it so it can never balloon and push the host into swap;
    # allkeys-lru means that under pressure it drops the coldest keys rather
    # than failing writes outright.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    # Not published to the host: only the other services on this compose
    # network need it, and it should not be reachable from outside at all.
    expose:
      - "6379"

volumes:
  storage_app:
