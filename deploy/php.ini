; Layered on top of PHP's own php.ini-production inside the container
; (/usr/local/etc/php/conf.d/, loaded last). The official PHP image — which
; dunglas/frankenphp builds on — ships php.ini-production but does not
; activate it, so without this file PHP runs on its compiled-in defaults.

; ---- OPcache ----
; The extension is installed but was never configured, so PHP re-checked
; every source file on disk on every request. In this container the code
; only ever changes when a new image is deployed, which always means a new
; container, so revalidation buys nothing.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
; Laravel + Filament + vendor is well over 10k files; too low a cap here
; silently evicts files and defeats the cache.
opcache.max_accelerated_files = 20000

; ---- Path resolution ----
; Filament resolves components by walking directories, so a bigger realpath
; cache pays off directly here.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---- Uploads ----
; PHP is the first of four independent size limits (then Livewire's
; temporary-upload rule, then Filament's own maxSize(), then Media Library's
; max_file_size). The other three are already set to 45MB for the queue-screen
; advertisement uploads; on compiled-in defaults PHP would have capped every
; upload at 2MB regardless.
upload_max_filesize = 48M
post_max_size = 64M
max_execution_time = 120

; Backing up the Penomoran Dokumen module builds its archive in memory, which
; the 128M default is not enough for.
memory_limit = 512M
